[Metadata]
# Name
Name="Minimal Amber"
# Version
Version=1
# Author
Author="RickoNoNo3; based on the Fcitx default dark theme"
# Description
Description="Flat dark candidate panel with amber highlight and dark selected text"

[InputPanel]
# Normal text color
NormalColor=#f6f5f4
# Highlight text color
HighlightColor=#1c1c1c
# Highlight Background color
HighlightBackgroundColor=#e5a50a
# Highlight Candidate Text Color
HighlightCandidateColor=#000000
# Candidate Label Text Size Factor
LabelTextSizeFactor=100
# Candidate Label Text Color
CandidateLabelColor=
# Highlight Candidate Label Text Color
HighlightCandidateLabelColor=
# Candidate Comment Text Size Factor
CommentTextSizeFactor=75
# Candidate Comment Text Color
CandidateCommentColor=
# Highlight Candidate Comment Text Color
HighlightCandidateCommentColor=
# Enable Blur on KWin
EnableBlur=False
# Blur mask
BlurMask=
# Use all horizontal space for highlight when it is vertical list
FullWidthHighlight=True
# Page button vertical alignment
PageButtonAlignment="Last Candidate"

[InputPanel/BlurMargin]
# Margin Left
Left=0
# Margin Right
Right=0
# Margin Top
Top=0
# Margin Bottom
Bottom=0

